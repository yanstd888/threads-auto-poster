<svg xmlns="http://www.w3.org/2000/svg" width="720" height="250" viewBox="0 0 720 250" role="img" aria-labelledby="title desc">
  <title id="title">Supported CLI tools: Hermes Agent</title>
  <desc id="desc">A dark README card showing Hermes Agent as the currently supported CLI integration.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#0b1020"/><stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1">
      <stop stop-color="#f59e0b"/><stop offset="1" stop-color="#f97316"/>
    </linearGradient>
  </defs>
  <rect width="720" height="250" rx="18" fill="url(#bg)"/>
  <rect x="1" y="1" width="718" height="248" rx="17" fill="none" stroke="#334155"/>
  <text x="28" y="42" fill="#f8fafc" font-family="Arial, sans-serif" font-size="24" font-weight="700">Supported CLI Tools</text>
  <text x="28" y="70" fill="#94a3b8" font-family="Arial, sans-serif" font-size="15">Content generation currently integrates with one CLI runtime.</text>
  <rect x="28" y="98" width="664" height="120" rx="12" fill="#111827" stroke="#475569"/>
  <rect x="48" y="118" width="80" height="80" rx="16" fill="#ffffff"/>
  <image href="hermes-agent.png" x="48" y="118" width="80" height="80" preserveAspectRatio="xMidYMid meet"/>
  <text x="150" y="145" fill="#f8fafc" font-family="Arial, sans-serif" font-size="22" font-weight="700">Hermes Agent</text>
  <text x="150" y="173" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="15">Optional AI content generation via the local CLI</text>
  <text x="150" y="197" fill="#94a3b8" font-family="Arial, sans-serif" font-size="13">Provider and model are configured by the self-hosted operator.</text>
</svg>
