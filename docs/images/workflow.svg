<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
  <title id="title">Threads Auto Poster workflow</title>
  <desc id="desc">A five-step workflow from approved sources to a reviewed and scheduled Threads post.</desc>
  <defs>
    <linearGradient id="canvas" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#0b1020"/><stop offset="1" stop-color="#172033"/></linearGradient>
    <linearGradient id="card" x1="0" x2="1"><stop stop-color="#172033"/><stop offset="1" stop-color="#1e293b"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000" flood-opacity=".25"/></filter>
  </defs>
  <rect width="1200" height="330" rx="20" fill="url(#canvas)"/>
  <text x="48" y="48" fill="#f8fafc" font-family="Arial, sans-serif" font-size="25" font-weight="700">A safer Threads publishing workflow</text>
  <text x="48" y="77" fill="#94a3b8" font-family="Arial, sans-serif" font-size="15">Research first. Review before publishing. Keep the data and deployment under your control.</text>
  <g font-family="Arial, sans-serif">
    <g filter="url(#shadow)"><rect x="48" y="125" width="190" height="128" rx="14" fill="url(#card)" stroke="#475569"/><circle cx="82" cy="160" r="20" fill="#f59e0b"/><text x="82" y="167" text-anchor="middle" fill="#111827" font-size="16" font-weight="700">1</text><text x="72" y="204" fill="#f8fafc" font-size="17" font-weight="700">Approved sources</text><text x="72" y="228" fill="#94a3b8" font-size="13">HTTPS registry + health checks</text></g>
    <g filter="url(#shadow)"><rect x="272" y="125" width="190" height="128" rx="14" fill="url(#card)" stroke="#475569"/><circle cx="306" cy="160" r="20" fill="#fb923c"/><text x="306" y="167" text-anchor="middle" fill="#111827" font-size="16" font-weight="700">2</text><text x="296" y="204" fill="#f8fafc" font-size="17" font-weight="700">Content strategy</text><text x="296" y="228" fill="#94a3b8" font-size="13">Pillars + compositions</text></g>
    <g filter="url(#shadow)"><rect x="496" y="125" width="190" height="128" rx="14" fill="url(#card)" stroke="#475569"/><circle cx="530" cy="160" r="20" fill="#f97316"/><text x="530" y="167" text-anchor="middle" fill="#111827" font-size="16" font-weight="700">3</text><text x="520" y="204" fill="#f8fafc" font-size="17" font-weight="700">Draft + quality gate</text><text x="520" y="228" fill="#94a3b8" font-size="13">Optional Hermes Agent</text></g>
    <g filter="url(#shadow)"><rect x="720" y="125" width="190" height="128" rx="14" fill="url(#card)" stroke="#475569"/><circle cx="754" cy="160" r="20" fill="#ea580c"/><text x="754" y="167" text-anchor="middle" fill="#fff7ed" font-size="16" font-weight="700">4</text><text x="744" y="204" fill="#f8fafc" font-size="17" font-weight="700">Approval queue</text><text x="744" y="228" fill="#94a3b8" font-size="13">Manual review by default</text></g>
    <g filter="url(#shadow)"><rect x="944" y="125" width="190" height="128" rx="14" fill="url(#card)" stroke="#475569"/><circle cx="978" cy="160" r="20" fill="#c2410c"/><text x="978" y="167" text-anchor="middle" fill="#fff7ed" font-size="16" font-weight="700">5</text><text x="968" y="204" fill="#f8fafc" font-size="17" font-weight="700">Schedule → Threads</text><text x="968" y="228" fill="#94a3b8" font-size="13">OAuth + controlled publishing</text></g>
    <g stroke="#f97316" stroke-width="3" stroke-linecap="round" opacity=".9"><path d="M244 189h22"/><path d="M468 189h22"/><path d="M692 189h22"/><path d="M916 189h22"/></g>
  </g>
</svg>
